services:
  postgres-test:
    image: postgres:18-alpine
    container_name: count-it-keep-it-postgres-test
    restart: "no"
    ports:
      - "127.0.0.1:${TEST_PG_PORT:-5439}:5432"
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp_test_password
      POSTGRES_DB: erp_test
    tmpfs:
      - /var/lib/postgresql
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_test"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s
