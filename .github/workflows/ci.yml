name: CI

on:
  push:
    branches: [main, erp-main]
  pull_request:
    branches: [main, erp-main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, Unit & Postgres Integration Tests, Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_ci_password
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://erp:erp_ci_password@127.0.0.1:5432/erp_test
      TEST_DATABASE_URL: postgresql://erp:erp_ci_password@127.0.0.1:5432/erp_test
      AUTH_COOKIE_SECRET: ci-test-cookie-secret-at-least-32-characters-long
      DISABLE_RATE_LIMIT: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Lint all workspaces
        run: npm run lint

      - name: Apply Drizzle migrations to test Postgres
        run: npm run db:migrate

      - name: Run Vitest unit & integration suite
        run: npm test

      - name: Build production bundle
        run: npm run build

  e2e:
    name: Playwright Full-Stack E2E
    needs: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp_ci_password
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://erp:erp_ci_password@127.0.0.1:5432/erp_test
      TEST_DATABASE_URL: postgresql://erp:erp_ci_password@127.0.0.1:5432/erp_test
      AUTH_COOKIE_SECRET: ci-test-cookie-secret-at-least-32-characters-long
      DISABLE_RATE_LIMIT: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Apply Drizzle migrations to test Postgres
        run: npm run db:migrate

      - name: Run Playwright E2E suite
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
